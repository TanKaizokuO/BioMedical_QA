[project]
name = "biomedical-qa"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "datasets>=5.0.0",
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "pandas>=3.0.3",
    "rank-bm25>=0.2.2",
    "scikit-learn>=1.9.0",
    "sentence-transformers>=5.6.0",
    "torch>=2.13.0",
    "transformers>=5.14.1",
]

[dependency-groups]
dev = [
    "nbconvert>=7.17.1",
]
